name: StatusPlugin
version: ${version}
main: de.stylelabor.statusplugin.StatusPlugin
description: Status prefix system with chat formatting, tab list, and integrations
author: Markap
website: https://stylelabor.de
api-version: '26.2'

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    TAB:
      load: BEFORE
      required: false
      join-classpath: true
    LibertyBans:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  statusplugin.admin:
    description: Full administration access for StatusPlugin
    default: op
    children:
      statusplugin.reload: true
      statusplugin.mod: true
  statusplugin.reload:
    description: Permission to reload StatusPlugin configuration
    default: op
  statusplugin.mod:
    description: Permission to use the MOD status
    default: op
