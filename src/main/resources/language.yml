# Language Configuration
# All messages use MiniMessage format

# Prefix used in all plugin messages
prefix: "<gray>[<gradient:gold:yellow>Status</gradient>]</gray> "

# ==========================================
# General Messages
# ==========================================
messages:
  # Status commands
  status-set: "<prefix><green>Your status has been set to <status>."
  status-cleared: "<prefix><yellow>Your status has been cleared."
  status-current: "<prefix><gray>Your current status: <status>"
  status-current-none: "<prefix><gray>You don't have a status set. Use <white>/status <option></white> to set one."
  status-invalid: "<prefix><red>Invalid status! Use tab-completion to see available options."
  status-no-permission: "<prefix><red>You don't have permission to use this status."
  status-list-header: "<prefix><gray>Available statuses:"
  status-list-item: "<gray> • <white><status_key></white>: <status_display>"
  
  # Admin commands
  admin-status-set: "<prefix><green>Set <white><target></white>'s status to <status>."
  admin-status-target-offline: "<prefix><red>Player <white><target></white> is not online."
  admin-reload: "<prefix><green>Configuration reloaded successfully!"
  admin-no-permission: "<prefix><red>You don't have permission to do this."
  
  # Death tracking
  deaths-view: "<prefix><gray><target>'s deaths: <white><deaths></white>"
  deaths-set: "<prefix><green>Set <white><target></white>'s deaths to <white><deaths></white>."
  deaths-add: "<prefix><green>Added <white><amount></white> deaths to <white><target></white>. Total: <white><deaths></white>"
  deaths-remove: "<prefix><green>Removed <white><amount></white> deaths from <white><target></white>. Total: <white><deaths></white>"
  deaths-reset: "<prefix><yellow>Reset <white><target></white>'s deaths to <white>0</white>."
  
  # Error messages
  error-player-only: "<prefix><red>This command can only be used by players."
  error-invalid-usage: "<prefix><red>Invalid usage. <white><usage></white>"
  error-player-not-found: "<prefix><red>Player not found."
  error-invalid-number: "<prefix><red>Please enter a valid number."
  
  # Update checker
  update-available: "<prefix><yellow>A new version (<white><version></white>) is available on Modrinth!"
  update-link: "<click:open_url:'https://modrinth.com/plugin/statusplugin'><aqua>[Click here to download]</aqua></click>"

  # Status Suggestions / Requests
  requests-disabled: "<prefix><red>Status suggestions are currently disabled."
  requests-info-header: "<prefix><gold><bold>Status Suggestion Info</bold></gold>"
  requests-info-format: "<gray>You can format statuses using <yellow>MiniMessage</yellow> or <yellow>Legacy Color Codes</yellow>."
  requests-info-example-minimessage: "<gray> • MiniMessage: <white><gradient:#65FF64:#65FF64>[TEST]</gradient></white> → <gradient:#65FF64:#65FF64>[TEST]</gradient>"
  requests-info-example-legacy: "<gray> • Legacy Hex: <white>&x&6&5&F&F&6&4[TEST]</white> → <#65FF64>[TEST]</#65FF64>"
  requests-info-generator: "<gray> • Color generator: <click:open_url:'<url>'><hover:show_text:'<green>Click to open website</green>'><aqua><u><url></u></aqua></hover></click>"
  requests-info-brackets: "<gray> • Corner brackets required: <white><brackets_required></white> (must start with [ and end with ])"
  requests-info-limits: "<gray> • Your pending submissions: <white><pending>/<max></white>"
  requests-info-command: "<gray>Submit your suggestion: <yellow>/status-suggest <format></yellow>"
  requests-submitted: "<prefix><green>Your status suggestion <status_display><green> was submitted! (ID: <white><id></white>)"
  requests-limit-reached: "<prefix><red>You have reached the maximum pending suggestions limit (<white><max></white>). Please wait for an admin to review your pending requests."
  requests-brackets-required: "<prefix><red>Your status must start with <white>[</white> and end with <white>]</white> corner brackets! Example: <white>[TEST]</white>"
  requests-invalid-format: "<prefix><red>Invalid formatting syntax! Check <white>/status-suggest info</white> for help."
  requests-length-invalid: "<prefix><red>Status text must be between <white><min></white> and <white><max></white> characters."
  admin-requests-list-empty: "<prefix><gray>There are no pending status requests."
  admin-requests-list-header: "<prefix><gold><bold>Pending Status Requests (<count>):</bold></gold>"
  admin-requests-list-item: "<gray>[<white><id></white>] <yellow><player></yellow>: <status_display> <gray>(<white><raw></white>)</gray>"
  admin-requests-accepted: "<prefix><green>Request <white><id></white> accepted! Status <white><key></white> is now available."
  admin-requests-denied: "<prefix><yellow>Request <white><id></white> has been denied."
  admin-requests-not-found: "<prefix><red>Request <white><id></white> was not found."
  admin-requests-name-required: "<prefix><red>Please specify a status name: <white>/status-admin requests accept <id> <name></white>"
  admin-requests-reason-required: "<prefix><red>Please specify a reason: <white>/status-admin requests deny <id> <reason></white>"
  admin-requests-name-invalid: "<prefix><red>Invalid status name! Use letters, numbers, and underscores only."
  admin-requests-name-exists: "<prefix><red>A status with the name <white><key></white> already exists!"
  requests-notify-accepted: "<prefix><green>Your status suggestion <status_display><green> was accepted with name <white><key></white>! You can now use it."
  requests-notify-denied: "<prefix><red>Your status suggestion <status_display><red> was denied.<newline><prefix><gray>Reason: <white><reason></white>"


# ==========================================
# LibertyBans Integration
# ==========================================
libertybans:
  mute-notification: |
    <red><bold>You are muted!</bold></red>
    <gray>Reason: <white><reason></white></gray>
    <gray>Expires: <white><duration></white></gray>
